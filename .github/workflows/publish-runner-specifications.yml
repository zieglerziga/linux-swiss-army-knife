name: Collect and publish GitHub-hosted runner specifications

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-runner-specifications.yml
      - scripts/build-runner-site.sh
      - scripts/collect-runner-posix.sh
      - scripts/collect-runner-windows.ps1
      - site/**
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-specifications-pages
  cancel-in-progress: false

jobs:
  linux:
    name: Collect Linux - ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-slim
            architecture: X64
          - runner: ubuntu-22.04
            architecture: X64
          - runner: ubuntu-22.04-arm
            architecture: ARM64
          - runner: ubuntu-24.04
            architecture: X64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
          - runner: ubuntu-26.04
            architecture: X64
          - runner: ubuntu-26.04-arm
            architecture: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect local runner specifications
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: sh scripts/collect-runner-posix.sh > runner-spec.json

      - name: Upload runner record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-spec-${{ matrix.runner }}
          path: runner-spec.json
          if-no-files-found: error
          retention-days: 1

  macos:
    name: Collect macOS - ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: ARM64
          - runner: macos-15
            architecture: ARM64
          - runner: macos-15-intel
            architecture: X64
          - runner: macos-26
            architecture: ARM64
          - runner: macos-26-intel
            architecture: X64
          - runner: xcode-27
            architecture: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect local runner specifications
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: sh scripts/collect-runner-posix.sh > runner-spec.json

      - name: Upload runner record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-spec-${{ matrix.runner }}
          path: runner-spec.json
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Collect Windows - ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: X64
          - runner: windows-2025
            architecture: X64
          - runner: windows-2025-vs2026
            architecture: X64
          - runner: windows-11-arm
            architecture: ARM64
          - runner: windows-11-vs2026-arm
            architecture: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect local runner specifications
        shell: powershell
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: .\scripts\collect-runner-windows.ps1 -OutputPath runner-spec.json

      - name: Upload runner record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-spec-${{ matrix.runner }}
          path: runner-spec.json
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build static report
    needs:
      - linux
      - macos
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download collected runner records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runner-spec-*
          path: collected

      - name: Build static report
        run: sh scripts/build-runner-site.sh collected public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    name: Deploy GitHub Pages report
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
